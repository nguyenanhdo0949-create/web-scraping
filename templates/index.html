<!DOCTYPE html>
<html>
<head>
    <title>PRO Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2 class="text-center">🔥 Web Scraping PRO</h2>

<input class="form-control mb-3" id="search" onkeyup="searchRealtime()" placeholder="Search...">

<table class="table table-bordered">
<thead>
<tr>
    <th>Title</th>
    <th>Price/Author</th>
    <th>Source</th>
</tr>
</thead>

<tbody id="table-body">
{% for p in products %}
<tr>
    <td>{{ p[0] }}</td>
    <td>{{ p[1] }}</td>
    <td>{{ p[2] }}</td>
</tr>
{% endfor %}
</tbody>
</table>

<script>
async function searchRealtime() {
    let keyword = document.getElementById("search").value;

    let res = await fetch(`/search?keyword=${keyword}`);
    let result = await res.json();

    let table = document.getElementById("table-body");
    table.innerHTML = "";

    result.data.forEach(item => {
        table.innerHTML += `
        <tr>
            <td>${item[0]}</td>
            <td>${item[1]}</td>
            <td>${item[2]}</td>
        </tr>`;
    });
}
</script>

</body>
</html>
